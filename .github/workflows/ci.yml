name: MedResearch CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medresearch
          POSTGRES_USER: medresearch
          POSTGRES_PASSWORD: local-ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U medresearch" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py spectacular --validate --file /tmp/medresearch-openapi.yaml
      - run: python -m pytest -q
      - run: python -m pytest -q
        env:
          POSTGRES_DB: medresearch
          POSTGRES_USER: medresearch
          POSTGRES_PASSWORD: local-ci
          POSTGRES_HOST: 127.0.0.1
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ../backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python ../tests/deployment_smoke.py
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t medresearch:ci .
